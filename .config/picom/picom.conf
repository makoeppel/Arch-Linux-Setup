# picom configuration (picom is the maintained fork of compton).
# Converted from the former .config/compton.conf: options that picom no longer
# accepts were dropped (no-dnd-shadow, no-dock-shadow, clear-shadow, paint-on-overlay,
# dbe, glx-copy-from-front, glx-swap-method, refresh-rate) and vsync is a boolean now.

# shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.95;
shadow-red = 0.18;
shadow-green = 0.20;
shadow-blue = 0.25;
shadow-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'CoverGloobus'",
    "class_g = 'Tilda'",
    "class_g = 'Conky'",
    "class_g ?= 'Notify-osd'",
    "class_g = 'firefox'",
    "class_g = 'Firefox'",
    "class_g = 'Firefox-esr'",
    "class_g = 'Dmenu'",
    "name = 'Notification'",
    "_GTK_FRAME_EXTENTS@"
];

# fading
fading = true;
# integer milliseconds in picom (the old compton value 0.25 is not an integer)
fade-delta = 4;
fade-in-step = 0.02;
fade-out-step = 0.02;
fade-exclude = [ ];

# backend / general
backend = "xrender";
vsync = false;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
focus-exclude = [
    "class_g = 'Cairo-clock'",
    "class_g = 'CoverGloobus'",
    "class_g = 'Tilda'",
    "class_g = 'firefox'",
    "class_g = 'Firefox'",
    "class_g = 'Firefox-esr'"
];
invert-color-include = [ ];

wintypes:
{
    tooltip = { fade = true; shadow = true; opacity = 0.75; focus = true; };
    dock    = { shadow = false; };
    dnd     = { shadow = false; };
};
